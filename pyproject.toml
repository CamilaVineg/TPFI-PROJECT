[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tpfi"
version = "0.1.0"
description = "TPFI IS2 - Patron Proxy/Singleton/Observer sobre AWS DynamoDB"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Camila Vinegar", email = "" }]
keywords = ["aws", "dynamodb", "singleton", "proxy", "observer", "is2"]
dependencies = [
    "boto3>=1.34.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.6.0",
    "black>=24.8.0",
    "mypy>=1.11.0",
    "pytest>=8.3.0",
    "pytest-cov>=5.0.0",
    "pytest-mock>=3.14.0",
    "hypothesis>=6.113.0",
    "bandit>=1.7.9",
    "pdoc>=14.6.0",
]

[project.scripts]
singletonproxyobserver = "tpfi.server:main"
singletonclient = "tpfi.singleton_client:main"
observerclient = "tpfi.observer_client:main"

[tool.hatch.build.targets.wheel]
packages = ["src/tpfi"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]
# La plantilla Cookiecutter contiene sintaxis Jinja y los scripts de muestra
# fueron provistos por la catedra: no forman parte del codigo del proyecto.
extend-exclude = ["cookiecutter-tpfi", "samples"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "RET", "ARG", "D"]
ignore = ["D203", "D213"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D", "ARG"]

[tool.ruff.lint.isort]
known-first-party = ["tpfi"]

[tool.ruff.lint.pydocstyle]
convention = "pep257"

[tool.black]
line-length = 100
target-version = ["py310"]
extend-exclude = "(cookiecutter-tpfi|samples)"

[tool.mypy]
python_version = "3.10"
files = ["src/tpfi"]
strict = true
warn_unreachable = true

[tool.pyright]
include = ["src/tpfi"]
typeCheckingMode = "basic"
pythonVersion = "3.10"
reportMissingImports = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = [
    "--cov=tpfi",
    "--cov-report=term-missing",
    "--cov-report=html",
    "--cov-fail-under=85",
]
markers = [
    "acceptance: casos de prueba de aceptacion del TPFI",
]

[tool.coverage.run]
branch = true
source = ["src/tpfi"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

[tool.bandit]
exclude_dirs = ["tests"]
skips = []
