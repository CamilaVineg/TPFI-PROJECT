[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "{{ cookiecutter.package_name }}"
version = "{{ cookiecutter.version }}"
description = "{{ cookiecutter.project_description }}"
readme = "README.md"
license = { text = "{{ cookiecutter.license }}" }
requires-python = ">=3.10"
authors = [{ name = "{{ cookiecutter.author }}", email = "{{ cookiecutter.email }}" }]
keywords = ["aws", "dynamodb", "singleton", "proxy", "observer", "is2"]
dependencies = [
    "boto3>=1.34.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.6.0",
    "black>=24.8.0",
    "mypy>=1.11.0",
    "pytest>=8.3.0",
    "pytest-cov>=5.0.0",
    "pytest-mock>=3.14.0",
    "hypothesis>=6.113.0",
    "bandit>=1.7.9",
    "pdoc>=14.6.0",
]

[project.scripts]
{{ cookiecutter.app_name }} = "{{ cookiecutter.package_name }}.server:main"
{{ cookiecutter.client_name }} = "{{ cookiecutter.package_name }}.singleton_client:main"
{{ cookiecutter.observer_name }} = "{{ cookiecutter.package_name }}.observer_client:main"

[tool.hatch.build.targets.wheel]
packages = ["src/{{ cookiecutter.package_name }}"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]
extend-exclude = ["samples"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "RET", "ARG", "D"]
ignore = ["D203", "D213"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D", "ARG"]

[tool.ruff.lint.isort]
known-first-party = ["{{ cookiecutter.package_name }}"]

[tool.ruff.lint.pydocstyle]
convention = "pep257"

[tool.black]
line-length = 100
target-version = ["py310"]
extend-exclude = "samples"

[tool.mypy]
python_version = "3.10"
files = ["src/{{ cookiecutter.package_name }}"]
strict = true
warn_unreachable = true

[tool.pyright]
include = ["src/{{ cookiecutter.package_name }}"]
typeCheckingMode = "basic"
pythonVersion = "3.10"
reportMissingImports = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = [
    "--cov={{ cookiecutter.package_name }}",
    "--cov-report=term-missing",
    "--cov-report=html",
    "--cov-fail-under=85",
]
markers = [
    "acceptance: casos de prueba de aceptacion del TPFI",
]

[tool.coverage.run]
branch = true
source = ["src/{{ cookiecutter.package_name }}"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

[tool.bandit]
exclude_dirs = ["tests"]
skips = []
