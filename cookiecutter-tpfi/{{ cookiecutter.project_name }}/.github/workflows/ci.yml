name: CI/CD

on:
  push:
    branches: [main, master, pruebas]
  pull_request:
    branches: [main, master, pruebas]

permissions:
  contents: read

concurrency:
  group: {% raw %}${{ github.workflow }}-${{ github.ref }}{% endraw %}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, tipos, tests y seguridad
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: "{{ cookiecutter.python_version }}"
          cache: pip

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: ruff (lint)
        run: ruff check --output-format=github .

      - name: ruff (formato)
        run: ruff format --check .

      - name: black (formato consistente)
        run: black --check .

      - name: mypy (tipos)
        run: mypy

      - name: pyright (tipos)
        run: |
          pip install pyright
          pyright

      - name: bandit (seguridad)
        run: bandit -r src -c pyproject.toml

      - name: pytest (cobertura >= 85%)
        run: pytest --cov --cov-report=xml --cov-report=term-missing

      - name: Subir cobertura
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml
        if: always()

  docs:
    name: Documentacion con pdoc
    runs-on: ubuntu-latest
    needs: quality

    # La publicacion en GitHub Pages requiere escritura sobre el repositorio
    # y emision de un token para Pages. Se concede solo a este job.
    permissions:
      contents: write
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: {% raw %}${{ steps.deploy.outputs.page_url }}{% endraw %}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: "{{ cookiecutter.python_version }}"
          cache: pip

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Generar documentacion
        run: pdoc -o docs src/{{ cookiecutter.package_name }}

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Publicar documentacion en GitHub Pages
        id: deploy
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./docs
